[bar.default]
center = [ "launcher", "clock", "media" ]
end = [ "tray", "recorder", "clipboard", "notifications", "volume", "brightness", "battery", "session" ]
font_weight = 600
margin_ends = 0
radius = 0
start = [ "workspaces" ]
widget_spacing = 12

[battery.device."/org/freedesktop/UPower/devices/battery_hidpp_battery_0"]
warning_threshold = 5

[control_center]
sidebar = "full"
sidebar_section = "none"

    [control_center.calendar]
    show_events_card = false

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[hooks]
started = "noctalia msg plugin noctalia/screen_recorder:service all replay-start"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
address = "Braga, Portugal"

[lockscreen_widgets]
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-3" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 196.0
    box_width = 810.0
    cx = 1376.0
    cy = 1006.4000244140625
    output = "DP-3"
    placement_height = 1152.0
    placement_width = 2752.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
history_retention_hours = 1

[osd]
background_opacity = 0.96999997831881046
position = "top_right"
position_vertical = "top_right"

    [osd.kinds]
    media = false

[plugin_settings."noctalia/screen_recorder"]
audio_source = "both"
hide_inactive = true
replay_duration = 180
replay_enabled = false
video_source = "focused"

[plugins]
enabled = [ "noctalia/screen_recorder" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    enabled = false
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
password_style = "random"
settings_show_advanced = false

    [shell.launcher]
    fetch_exchange_rates = false

    [shell.panel]
    clipboard_placement = "attached"
    clipboard_position = "auto"
    launcher_placement = "attached"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_session = true

    [shell.screenshot]
    save_to_file = false

    [shell.session]
    grid = true
    grid_columns = 2

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "5"
        variant = "destructive"

        [[shell.session.actions]]
        action = "command"
        command = "/usr/bin/boot-windows"
        countdown_seconds = 0.0
        enabled = true
        label = "Boot to Windows"
        shortcut = "6"
        variant = "default"

[theme]
builtin = "Kanagawa"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "foot" ]

[wallpaper.automation]
enabled = true

[wallpaper.default]
path = "/home/aura/Pictures/Wallpapers/uwu_o0n2su8.png"

[wallpaper.last]
path = "/home/aura/Pictures/Wallpapers/uwu_o0n2su8.png"

[wallpaper.monitors.DP-3]
path = "/home/aura/Pictures/Wallpapers/uwu_o0n2su8.png"

[widget.clock]
format = "{:%d} of {:%b} - {:%H:%M}"
vertical_format = "{:%d} of {:%b}\\n{:%H:%M}"

[widget.launcher]
glyph = "cat"

[widget.media]
hide_when_no_media = true

[widget.notifications]
hide_when_no_unread = true

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.workspaces]
style = "minimal"
